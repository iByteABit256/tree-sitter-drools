[package]
name = "tree-sitter-drools"
description = "Drools grammar for tree-sitter"
version = "0.2.0"
authors = ["Pavlos Smith <paulsmith4561@proton.me>"]
license = "AGPLv3"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "drools"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/ibyteabit256/tree-sitter-drools.git"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.5"
